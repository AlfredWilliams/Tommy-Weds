<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/images/t1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thomas & Vivian | Eternity</title>
    <script src="https://cdn.tailwindcss.com"></script>
   
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              champagne: {
                50: '#fcfbf7',
                100: '#f7f4e8',
                200: '#efe6cd',
                300: '#e5d1a8',
                400: '#dbc18b',
                500: '#c69f5e',
                600: '#aa7e46',
                700: '#885f38',
                800: '#704c32',
                900: '#5c3f2d',
              },
              blush: {
                50: '#fdf2f2',
                100: '#fce7e7',
                200: '#fad4d4',
                300: '#f6b2b2',
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 1s ease-out forwards',
              'sparkle': 'sparkle 2s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              sparkle: {
                '0%, 100%': { opacity: '0', transform: 'scale(0)' },
                '50%': { opacity: '1', transform: 'scale(1)' },
              }
            }
          },
        },
      }
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fcfbf7; /* Champagne 50 */
        color: #5c3f2d; /* Champagne 900 */
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Playfair Display', serif;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .luxury-border {
        border: 1px solid rgba(198, 159, 94, 0.3);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f7f4e8;
      }
      ::-webkit-scrollbar-thumb {
        background: #dbc18b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c69f5e;
      }
    </style>
